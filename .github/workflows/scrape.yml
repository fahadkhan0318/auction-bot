name: Scheduled Tax Sale Scrape

on:
  schedule:
    # Four runs a day, written against Pakistan time (PKT = UTC+5, and
    # Pakistan observes no DST, so this mapping is fixed year-round — unlike
    # the Central-time schedule this replaced, which drifted an hour every
    # spring and autumn).
    #
    # GitHub only *queues* a scheduled workflow at the cron time; on the
    # shared pool it starts hours later and never early. So these crons are
    # NOT the wanted times — each one is fired early by its slot's measured
    # median delay, so the run itself lands on target.
    #
    # Measured over 110 runs (18 Aug - 22 Sep 2026), median queue delay by
    # cron hour: 10:00 UTC +4h00 (n=29), 16:00 UTC +2h59 (n=36), 22:00 UTC
    # +1h56 (n=36). The delay falls steadily as the UTC day goes on, so the
    # two slots with no direct measurement (07:17 and 11:17) are interpolated
    # off that curve.
    #
    # The ':17' matters: every sample above was a ':00' cron, which is the
    # busiest minute on GitHub's queue. Firing off the top of the hour should
    # shave some delay by itself.
    #
    #   cron (UTC)    fires (PKT)    assumed delay    lands (PKT)
    #   07:17          12:17 PM         ~3h45            ~4:00 PM
    #   11:17           4:17 PM         ~3h45            ~8:00 PM
    #   16:17           9:17 PM         ~2h45           ~12:00 AM
    #   20:17           1:17 AM         ~1h45            ~3:00 AM
    #
    # Spread is wide (p25-p75 spans 1-2h), so individual runs will still land
    # early or late; this centres them rather than pinning them. Re-tune by
    # re-measuring delay per cron hour after a week or so of new data. If a
    # run lands consistently early, push its cron later, and vice versa.
    #
    # PKT is UTC+5 with no DST, so this mapping holds year-round — unlike the
    # Central-time schedule it replaced, which drifted an hour every spring
    # and autumn. Each run takes ~38 min (p90 95 min).
    - cron: '17 7 * * *'    # → lands ~ 4:00 PM PKT
    - cron: '17 11 * * *'   # → lands ~ 8:00 PM PKT
    - cron: '17 16 * * *'   # → lands ~12:00 AM PKT (midnight)
    - cron: '17 20 * * *'   # → lands ~ 3:00 AM PKT
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape-run
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + browser + system deps
        run: |
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Write Google service-account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json

      - name: Check VPN secret present
        id: vpncheck
        env:
          WG_CONF: ${{ secrets.SURFSHARK_WG_CONF }}
        run: echo "has_secret=${{ env.WG_CONF != '' }}" >> "$GITHUB_OUTPUT"

      # Sheriff sale sites geo-block non-US traffic, so the runner's own
      # (non-US) IP won't load them — tunnel through Surfshark (US server)
      # for just the scraper step, then drop the tunnel again. Skipped (with
      # a warning) if SURFSHARK_WG_CONF isn't set yet, so the rest of the
      # pipeline can still be test-run — Sheriff will just fail to load.
      - name: Connect Surfshark VPN (US)
        if: steps.vpncheck.outputs.has_secret == 'true'
        env:
          WG_CONF: ${{ secrets.SURFSHARK_WG_CONF }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          echo "$WG_CONF" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo sed -i '/^DNS/d' /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "Public IP is now:"
          curl -s https://ifconfig.co

      - name: Warn if VPN not configured
        if: steps.vpncheck.outputs.has_secret != 'true'
        run: echo "::warning::SURFSHARK_WG_CONF secret not set — running without VPN, Sheriff (geo-blocked) will likely fail this run."

      - name: Run scraper (unattended)
        env:
          AUTO_RUN: '1'
          USER: ${{ secrets.SITE_USER }}
          PASS: ${{ secrets.SITE_PASS }}
        run: xvfb-run -a python main.py

      - name: Disconnect VPN
        if: always() && steps.vpncheck.outputs.has_secret == 'true'
        run: sudo wg-quick down wg0 || true

      - name: Remove credentials file
        if: always()
        run: rm -f credentials.json

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "auction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_*.csv scraped_db_*.json
          git diff --cached --quiet || git commit -m "Auto-scrape update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
