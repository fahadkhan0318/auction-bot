name: Scheduled Tax Sale Scrape

on:
  schedule:
    # Times are UTC and correspond to roughly 8 AM / 2 PM / 8 PM US Central time.
    # Central is UTC-5 (CDT, Mar-Nov) or UTC-6 (CST, Nov-Mar) — these are set for
    # CDT, so during CST (winter) the actual run lands ~1 hour earlier locally.
    - cron: '0 13 * * *'   # ~8 AM Central
    - cron: '0 19 * * *'   # ~2 PM Central
    - cron: '0 1 * * *'    # ~8 PM Central
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape-run
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + browser + system deps
        run: |
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Write Google service-account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json

      - name: Check VPN secret present
        id: vpncheck
        env:
          WG_CONF: ${{ secrets.SURFSHARK_WG_CONF }}
        run: echo "has_secret=${{ env.WG_CONF != '' }}" >> "$GITHUB_OUTPUT"

      # Sheriff sale sites geo-block non-US traffic, so the runner's own
      # (non-US) IP won't load them — tunnel through Surfshark (US server)
      # for just the scraper step, then drop the tunnel again. Skipped (with
      # a warning) if SURFSHARK_WG_CONF isn't set yet, so the rest of the
      # pipeline can still be test-run — Sheriff will just fail to load.
      - name: Connect Surfshark VPN (US)
        if: steps.vpncheck.outputs.has_secret == 'true'
        env:
          WG_CONF: ${{ secrets.SURFSHARK_WG_CONF }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          echo "$WG_CONF" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo sed -i '/^DNS/d' /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "Public IP is now:"
          curl -s https://ifconfig.co

      - name: Warn if VPN not configured
        if: steps.vpncheck.outputs.has_secret != 'true'
        run: echo "::warning::SURFSHARK_WG_CONF secret not set — running without VPN, Sheriff (geo-blocked) will likely fail this run."

      - name: Run scraper (unattended)
        env:
          AUTO_RUN: '1'
          USER: ${{ secrets.SITE_USER }}
          PASS: ${{ secrets.SITE_PASS }}
        run: xvfb-run -a python main.py

      - name: Disconnect VPN
        if: always() && steps.vpncheck.outputs.has_secret == 'true'
        run: sudo wg-quick down wg0 || true

      - name: Remove credentials file
        if: always()
        run: rm -f credentials.json

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "auction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_*.csv scraped_db_*.json
          git diff --cached --quiet || git commit -m "Auto-scrape update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
