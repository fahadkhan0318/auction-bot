name: Scheduled Tax Sale Scrape

on:
  schedule:
    # Times are UTC and correspond to roughly 8 AM / 2 PM / 8 PM US Central time.
    # Central is UTC-5 (CDT, Mar-Nov) or UTC-6 (CST, Nov-Mar) — these are set for
    # CDT, so during CST (winter) the actual run lands ~1 hour earlier locally.
    - cron: '0 13 * * *'   # ~8 AM Central
    - cron: '0 19 * * *'   # ~2 PM Central
    - cron: '0 1 * * *'    # ~8 PM Central
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape-run
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + browser + system deps
        run: |
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Write Google service-account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json

      - name: Run scraper (unattended)
        env:
          AUTO_RUN: '1'
          USER: ${{ secrets.SITE_USER }}
          PASS: ${{ secrets.SITE_PASS }}
        run: xvfb-run -a python main.py

      - name: Remove credentials file
        if: always()
        run: rm -f credentials.json

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "auction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_*.csv scraped_db_*.json
          git diff --cached --quiet || git commit -m "Auto-scrape update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
